<!doctype html>
<html><body style="margin:0;overflow:hidden;background:#000">
<canvas id="c" width="1920" height="1080" style="display:block"></canvas>
<script>
// Renders one frame of the loop (at ?t= seconds) full-size, for use as the video poster.
const v = document.createElement('video');
v.src = '../assets/video/craft-loom-bw.mp4'; v.muted = true; v.preload = 'auto';
const t = Number(new URLSearchParams(location.search).get('t') || 2.2);
v.addEventListener('loadedmetadata', () => { v.currentTime = t; });
v.addEventListener('seeked', () => { document.getElementById('c').getContext('2d').drawImage(v, 0, 0, 1920, 1080); });
</script></body></html>
